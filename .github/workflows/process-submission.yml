name: Process Hunt Submission

on:
  issues:
    types: [opened]

jobs:
  process:
    # Only run on submissions, not bot commits — AND only if created by the
    # Worker's own PAT-owning account. Without the author check, anyone on
    # GitHub could open a [HUNT] issue directly and score points with no
    # team auth, no photo, no rate limit. (Confirmed exploited live 2026-08-31.)
    if: startsWith(github.event.issue.title, '[HUNT]') && github.event.issue.user.login == 'michalbojkogdansk'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Process submission
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
        run: python3 .github/scripts/process_submission.py

      - name: Commit score update
        run: |
          git config user.name "GeoVision Hunt Bot"
          git config user.email "hunt-bot@noreply.github.com"
          git add data/scores.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "score: $(cat /tmp/commit_msg.txt) [skip ci]"
          # Retry with reset+reprocess on conflict (JSON can't be git-rebased safely)
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push failed (attempt $i), resetting to latest and reprocessing..."
            sleep $((i * 2))
            git fetch origin main
            git reset --hard origin/main
            python3 .github/scripts/process_submission.py
            git add data/scores.json
            if git diff --staged --quiet; then
              echo "No changes after reprocess (already applied upstream) — done"
              break
            fi
            git commit -m "score: $(cat /tmp/commit_msg.txt) [skip ci]"
          done

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '✓ Find registered.';
            try { comment = fs.readFileSync('/tmp/issue_comment.txt', 'utf8'); } catch(e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
